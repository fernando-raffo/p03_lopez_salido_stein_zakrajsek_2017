[project]
type = "pipeline"
id = "P01"
name = "Credit-Market Sentiment and the Business Cycle"
description = """Replication of Tables I-II and Figures I-II from López-Salido, David, Jeremy C. Stein, and Egon Zakrajšek. \
"Credit-Market Sentiment and the Business Cycle." The Quarterly Journal of Economics 132, no. 3 (2017): 1373–1426. \
Data is drawn from FRED, WRDS Mergent FISD, Robert Shiller's data website, and Greenwood and Hanson's published \
high-yield share series. The original analysis is extended by (1) constructing an analogous credit-spread measure using \
Aaa-Treasury spreads rather than Baa-Treasury spreads, and (2) testing the sentiment measure out of sample over the 2020-2022 \
period which includes the COVID-19 shock and the 2021-2022 post COVID froth."""
maintainer = "Fernando Raffo, Bangjie Xu"
contributors = ["Fernando Raffo", "Bangjie Xu"]
os_compatibility = ["Windows", "Linux", "MacOS"]
repo_url = "https://github.com/fernando-raffo/p03_lopez_salido_stein_zakrajsek_2017"
copyright = "2026"
logo = "assets/logo.png"

[notebooks]

[notebooks.01_summary_statistics]
notebook_name = "Data Walkthrough & Summary Statistics"
description = "Guided tour of the data."
path = "./src/01_summary_statistics.ipynb"

[notebooks.02_replication]
notebook_name = "Replication Walkthrough"
description = "Guided walkthrough of replication of the paper."
path = "./src/02_replication.ipynb"

[notebooks.03_extension]
notebook_name = "Extension Walkthrough"
description = "Guided walkthrough of extension, replicating the paper methodology with the Aaa-Treasury spread."
path = "./src/03_extension.ipynb"

[notebooks.04_case_study]
notebook_name = "Case Study"
description = "Walkthrough of the signal's reaction to the 2020 COVID shock and the post COVID market."
path = "./src/04_case_study.ipynb"

[dataframes]

[dataframes.fred_macroeconomic_variables]
name = "FRED Macroeconomic Data"
description = "Raw macroeconomic and financial time series pulled directly from FRED via `pandas_datareader`: corporate bond yields, Treasury yields, CPI, population, and real GDP, used as the primary inputs for the replication's cleaned monthly and annual series."
sources = ["FRED", "Office of Financial Research"]
providers = ["FRED", "Office of Financial Research"]
provider_links = ["https://fred.stlouisfed.org/"]
tags = ["raw data", "macroeconomic data", "FRED"]
access_types = ["Public"]
license = "No"
contact_required = "No"
restrictions = "No"
pull_method = "Web API via Python `pandas_datareader.data.DataReader`"
path = "./_data/raw_data/fred.parquet"
date_col = "DATE"
docs_path = "./_data/data_dictionaries/fred_data_dictionary.md"

[dataframes.shiller_market_variables]
name = "Robert Shiller's Stock Market Data"
description = "Robert Shiller's monthly U.S. stock-market data set (`ie_data.xls`): the S&P Composite price, dividends, earnings, CPI, the 10-year Treasury yield, and the cyclically adjusted price-earnings ratio (CAPE / P/E10)."
sources = ["Robert Shiller's Data Website"]
providers = ["Robert Shiller"]
provider_links = ["https://shillerdata.com/"]
tags = ["raw data", "stock market", "Shiller"]
access_types = ["Public"]
license = "No"
